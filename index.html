
<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --efs-red: #C9343C;
        --efs-red-dark: #a82a32;
        --whatsapp-green: #25D366;
      }
      body { 
        font-family: 'Roboto', sans-serif; 
        scroll-behavior: smooth; 
        margin: 0; 
        overflow-x: hidden; 
        background-color: white;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      .bg-efs-red { background-color: var(--efs-red); }
      .text-efs-red { color: var(--efs-red); }
      .border-efs-red { border-color: var(--efs-red); }
      .bg-whatsapp { background-color: var(--whatsapp-green); }
      
      .hero-gradient { 
        background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(201, 52, 60, 0.45));
      }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: var(--efs-red); }

        height: auto;
        display: block;
        margin: 0 auto;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
        filter: drop-shadow(0 0 0 rgba(201, 52, 60, 0));
      }

      .mapa-brasil:hover {
        transform: scale(1.05);
        filter: brightness(1.2) drop-shadow(0 0 15px rgba(201, 52, 60, 0.4));
        cursor: pointer;
      }

      .btn-hover-effect {
        transition: all 0.3s ease;
      }
      .btn-hover-effect:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      }

      .faq-answer {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out, padding 0.3s ease;
      }
      .faq-answer.active {
        max-height: 500px;
        padding-bottom: 1.5rem;
      }

      .slider-container {
        display: flex;
        transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .slide-item {
        min-width: 100%;
        width: 100%;
      }

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, memo, useRef } = React;

      const WHATSAPP_LINK = "https://wa.me/5567992269684?text=Quero%20fazer%20uma%20cota%C3%A7%C3%A3o";
      const INSTAGRAM_LINK = "https://www.instagram.com/efs.transportes/";
      const EMAIL_ADDRESS = "contato@efstransporte.com.br";
      const LOGO_PATH = "assets/logo.webp";
      const AUTISMO_LOGO_PATH = "assets/autismo.webp";
      const CNPJ_NUMBER = "36.104.716/0001-86";

      // --- COMPONENTES AUXILIARES ---
      const WhatsAppBtn = ({ className = "", text = "Solicitar Orçamento" }) => (
        <a 
          href={WHATSAPP_LINK} 
          target="_blank" 
          rel="noopener noreferrer"
          className={`inline-flex items-center gap-2 bg-[#25D366] hover:bg-[#1ebc57] text-white font-bold px-6 py-3 rounded shadow-lg transition-all btn-hover-effect uppercase text-xs tracking-widest ${className}`}

          <svg viewBox="0 0 24 24" className="w-5 h-5 fill-current"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.767 5.767 0 1.267.405 2.436 1.096 3.389l-.72 2.632 2.696-.706a5.736 5.736 0 0 0 2.695.68h.001c3.181 0 5.767-2.586 5.767-5.767 0-3.181-2.586-5.767-5.768-5.767zm3.39 8.201c-.148.42-.756.764-1.04.811-.285.047-.639.068-1.04-.047-.245-.07-.54-.165-.92-.33a4.757 4.757 0 0 1-1.92-1.683c-.38-.495-.662-1.07-.662-1.683 0-1.12.58-1.666.79-1.884.21-.218.463-.273.611-.273s.3.003.43.011c.14.01.32-.037.5.39.19.45.64 1.556.69 1.666.06.11.09.24.02.38-.07.14-.15.24-.25.35-.1.11-.21.24-.3.35-.1.11-.21.24-.3.35-.1.11-.21.23-.09.43.12.2.53.88 1.14 1.43.78.7 1.44.92 1.64 1.03.2.11.31.09.43-.04.12-.13.52-.6.66-.81.14-.21.28-.17.47-.1.19.07 1.2.57 1.4.67.2.11.33.16.38.25.05.09.05.52-.1.94z"/></svg>

      );

        const icons = {
          units: <path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/>,

      };

      // --- COMPONENTES PRINCIPAIS ---

      const Header = memo(() => {
        const [isOpen, setIsOpen] = useState(false);
        const [isScrolled, setIsScrolled] = useState(false);
        const [isVisible, setIsVisible] = useState(true);
        const lastScrollY = useRef(0);

        useEffect(() => {
          const handleScroll = () => {
            const currentScrollY = window.scrollY;
            setIsScrolled(currentScrollY > 50);
            setIsVisible(currentScrollY <= lastScrollY.current || currentScrollY <= 100);
            lastScrollY.current = currentScrollY;

          return () => window.removeEventListener('scroll', handleScroll);

          <React.Fragment>

                    />

                      <li key={name}><a href={`#${name.toLowerCase().replace(' ', '-')}`} className="hover:text-efs-red transition-colors border-b-2 border-transparent hover:border-efs-red pb-0.5">{name}</a></li>
                    ))}

            </a>

      const Hero = memo(() => (

                      ))}
                    </div>
                    <div className="absolute bottom-4 right-8 z-30 flex gap-2">
                       {aboutImgs.map((_, i) => (

                    </div>
                  </div>
                  <WhatsAppBtn text="Falar com nossa Equipe" />
                </div>
              </div>
            </div>
          </section>
        );
      });

      const Services = memo(() => (
        <section id="servicos" className="py-10 bg-[#2b2d2f]">
          <div className="container mx-auto px-4 text-center">
            <h2 className="text-2xl font-black text-efs-red mb-4 uppercase italic">Soluções Logísticas e de transporte em Campo Grande MS</h2>
            <p className="text-white text-sm md:text-base max-w-2xl mx-auto mb-12 leading-relaxed font-medium">Atendemos as principais regiões do país com a expertise de quem entende cada desafio do asfalto.</p>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-6xl mx-auto mb-12">

                { title: 'Armazenagem Estratégica', desc: 'Armazenagem estratégica: Galpão próprio, logística profissional e gestão eficiente.', icon: 'units' },

                  <h3 className="text-white font-bold text-lg uppercase">{service.title}</h3>

                </div>
              ))}

            <WhatsAppBtn text="Solicitar uma Cotação" />

      const Certifications = memo(() => (

            <h6 className="text-efs-red font-bold uppercase tracking-[0.2em] text-xs mb-2">Segurança e Conformidade</h6>
            <h2 className="text-3xl md:text-5xl font-black mb-4 uppercase tracking-tighter italic">

            <div className="w-16 h-1 bg-efs-red mb-6"></div>

              <div className="w-full md:w-1/2 flex flex-col items-start border-b md:border-b-0 md:border-r border-gray-600 pb-8 md:pb-0 md:pr-10">
                <h6 className="text-efs-red font-bold uppercase tracking-widest text-xs mb-2">Autorização</h6>
                <h3 className="text-5xl font-black text-white uppercase tracking-tighter mb-2">Anvisa</h3>
                <h4 className="text-2xl font-bold text-gray-200 mb-6 leading-tight">Transporte de Saneantes<br />e Domissanitários</h4>
                <p className="text-gray-400 text-sm md:text-base leading-relaxed mb-8">

                <a 
                  href={WHATSAPP_LINK} 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="inline-flex items-center gap-3 bg-[#25D366] hover:bg-[#1ebc57] text-white font-bold px-6 py-3.5 rounded-md transition-all uppercase text-sm tracking-widest group btn-hover-effect"
                >
                  <svg viewBox="0 0 24 24" className="w-6 h-6 fill-white"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.767 5.767 0 1.267.405 2.436 1.096 3.389l-.72 2.632 2.696-.706a5.736 5.736 0 0 0 2.695.68h.001c3.181 0 5.767-2.586 5.767-5.767 0-3.181-2.586-5.767-5.768-5.767zm3.39 8.201c-.148.42-.756.764-1.04.811-.285.047-.639.068-1.04-.047-.245-.07-.54-.165-.92-.33a4.757 4.757 0 0 1-1.92-1.683c-.38-.495-.662-1.07-.662-1.683 0-1.12.58-1.666.79-1.884.21-.218.463-.273.611-.273s.3.003.43.011c.14.01.32-.037.5.39.19.45.64 1.556.69 1.666.06.11.09.24.02.38-.07.14-.15.24-.25.35-.1.11-.21.24-.3.35-.1.11-.21.24-.3.35-.1.11-.21.23-.09.43.12.2.53.88 1.14 1.43.78.7 1.44.92 1.64 1.03.2.11.31.09.43-.04.12-.13.52-.6.66-.81.14-.21.28-.17.47-.1.19.07 1.2.57 1.4.67.2.11.33.16.38.25.05.09.05.52-.1.94z"/></svg>
                  Solicitar Cotação
                  <svg className="w-5 h-5 ml-1 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </a>
              </div>
              <div className="w-full md:w-1/2 flex justify-center items-center">
                <div className="bg-white p-8 rounded-xl shadow-[0_0_40px_rgba(255,255,255,0.05)] w-full max-w-[320px] aspect-square flex items-center justify-center">
                  <img src="assets/anvisa.png" alt="ANVISA - Agência Nacional de Vigilância Sanitária" className="w-full h-auto object-contain" />
                </div>
              </div>
            </div>

        const fleetImgs = [

          "assets/frota2.img",

        return (
